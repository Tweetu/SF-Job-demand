name: Self-test (safe, saves nothing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Self-test
        env:
          PYTHONPATH: src
        run: python -m sfjobs.selftest | tee selftest.txt
      - name: Show results on the run page
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat selftest.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
